# Model TESTOWY biblioteki lamela.obliczenia (fizyka budowli / energia) — NIE jest projektem Domu LAMELA.
# Cechy sprawdzane: garaż nieogrzewany (b_u), łazienki 24 °C (powietrze transferowe), wspornik bryły P1 nad powietrzem
# zewnętrznym (strop_zewn z ociepleniem spodu), strop nad garażem z ociepleniem, odsłonięty stropodach zielony nad P0,
# płyta dachu wysunięta na południe (okap), izolacja obwodowa, węzły `wezly`, sekcja `energia`, `stolarka`.
meta: {nazwa: "Dom testowy — energia", wersja: "1.0", data: "2026-09-25"}
uklad: {zero_abs: 101.65, azymut_osi_y: 0.0}
osie:
  x: {A: 0.0, B: 3.0, C: 6.0, D: 9.0, E: 10.0, F: 13.0, G: 16.0}
  y: {"0": -1.0, "1": 0.0, "2": 3.0, "3": 8.0}
kondygnacje:
  - {id: P0, nazwa: Parter, rzedna: 0.00, wys_kondygnacji: 3.10, wys_w_swietle: 2.70, podloga: POD-0}
  - {id: P1, nazwa: Piętro, rzedna: 3.10, wys_kondygnacji: 2.90, wys_w_swietle: 2.70, podloga: POD-1}

