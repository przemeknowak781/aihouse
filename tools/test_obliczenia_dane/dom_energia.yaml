przegrody:
  SZ1:
    nazwa: "Ściana zewnętrzna, silikat 18 + ETICS EPS 20"
    typ: sciana_zewn
    warstwy:
      - {mat: TYNK_GIPS, d: 0.015}
      - {mat: SIL18, d: 0.18, konstrukcyjna: true}
      - {mat: EPS031, d: 0.20}
      - {mat: TYNK_SIL, d: 0.007}
  SWG:
    nazwa: "Ściana dom–garaż, silikat 18 + EPS 12 od garażu"
    typ: sciana_wewn_nosna
    warstwy:
      - {mat: TYNK_GIPS, d: 0.015}
      - {mat: SIL18, d: 0.18, konstrukcyjna: true}
      - {mat: EPS031, d: 0.12}
      - {mat: TYNK_SIL, d: 0.007}
  SZG:
    nazwa: "Ściana zewnętrzna garażu nieogrzewanego, silikat 24"
    typ: sciana_zewn
    warstwy:
      - {mat: TYNK_CEM, d: 0.015}
      - {mat: SIL24, d: 0.24, konstrukcyjna: true}
      - {mat: TYNK_SIL, d: 0.007}
  SD1:
    nazwa: "Ścianka działowa, silikat 12"
    typ: scianka_dzialowa
    warstwy:
      - {mat: TYNK_GIPS, d: 0.015}
      - {mat: SIL12, d: 0.12, konstrukcyjna: true}
      - {mat: TYNK_GIPS, d: 0.015}
  POD-0:
    nazwa: "Podłoga na gruncie (izolacja pod jastrychem, papa na płycie)"
    typ: podloga_na_gruncie
    warstwy:
      - {mat: GRES, d: 0.010}
      - {mat: JASTRYCH, d: 0.065}
      - {mat: FOLIA_PE, d: 0.0002}
      - {mat: XPS300, d: 0.180}
      - {mat: PAPA_PW, d: 0.004}
      - {mat: ZB_C25, d: 0.120, konstrukcyjna: true}
      - {mat: PIASEK, d: 0.150}
  POD-G:
    nazwa: "Posadzka garażu na gruncie"
    typ: podloga_na_gruncie
    warstwy:
      - {mat: ZB_C25, d: 0.150, konstrukcyjna: true}
      - {mat: PIASEK, d: 0.150}
  POD-1:
    nazwa: "Podłoga na stropie (warstwy nad płytą)"
    typ: strop
    warstwy:
      - {mat: DESKA_DEB, d: 0.015}
      - {mat: JASTRYCH, d: 0.055}
      - {mat: EPS_AKU, d: 0.130}
  SUF-G:
    nazwa: "Ocieplenie spodu stropu nad garażem (EPS 20 + tynk)"
    typ: strop
    warstwy:
      - {mat: EPS031, d: 0.20}
      - {mat: TYNK_SIL, d: 0.007}
  SUF-Z:
    nazwa: "Ocieplenie spodu wspornika nad powietrzem zewnętrznym (EPS 25 + tynk)"
    typ: strop
    warstwy:
      - {mat: EPS031, d: 0.25}
      - {mat: TYNK_SIL, d: 0.007}
  SD-D1:
    nazwa: "Stropodach PIR 24 cm, EPDM"
    typ: stropodach
    warstwy:
      - {mat: EPDM, d: 0.0015}
      - {mat: PIR, d: 0.240, klin: {d_min: 0.24, d_max: 0.36, ksztalt: prostokat}}
      - {mat: PAROIZ, d: 0.004}
      - {mat: ZB_C30, d: 0.200, konstrukcyjna: true}
      - {mat: TYNK_GIPS, d: 0.010}
  DZ-P0:
    nazwa: "Stropodach zielony ekstensywny nad parterem"
    typ: stropodach
    warstwy:
      - {mat: SUBSTRAT, d: 0.080}
      - {mat: GEO, d: 0.002}
      - {mat: DREN, d: 0.025}
      - {mat: EPDM, d: 0.0015}
      - {mat: PIR, d: 0.220}
      - {mat: PAROIZ, d: 0.004}
      - {mat: ZB_C30, d: 0.200, konstrukcyjna: true}
      - {mat: TYNK_GIPS, d: 0.010}
  SD-G:
    nazwa: "Dach garażu (nieogrzewany)"
    typ: stropodach
    warstwy:
      - {mat: EPDM, d: 0.0015}
      - {mat: ZB_C30, d: 0.200, konstrukcyjna: true}

