reguly_pokoi_biurowych: ['Każdy pokój biurowy 24 m2 z 3 stanowiskami i punktami el./teletech. dla 3 os., niezależnie od obsady (PU s.4); wartość
    obligatoryjna (Wyj.3 odp.17).', 'GW (Wydział Geodezji i Kartografii): pokoje pracowników 32 m2 dla zespołów 4-os. (PU s.5).', 'Pokoje 1-os.:
    Członek Zarządu, dyrektorzy, zastępcy, samodzielne stanowiska - z możliwością pracy 3 os. (PU s.5).', Pokoje obok dyrekcji łatwo zamienialne
    i łączone drzwiami w sekretariaty (PU s.5)., Nie łączyć w jednym pokoju pracowników różnych wydziałów ani różnych działów (Wyj.3 odp.16; Wyj.16
    odp.69; Wyj.17 odp.70)., 'Wiersz ''X - Dyrekcja'' z pracownikami (np. 3.4, 3.5): 1 gabinet dyrektora + pokoje dla pracowników (Wyj.8 odp.48-49).',
  'Gabinety: pion 8 - CZ + dyrektorzy departamentów 8.1, 8.2 + dyrektorzy wydziałów obok siebie; piony 2-7, 9 - dyrektor departamentu + dyrektorzy
    wydziałów obok siebie i w pobliżu swoich komórek (PU s.5; Wyj.10 odp.62).', Wydziały jednego departamentu mogą zajmować 2 sąsiednie kondygnacje
    przy komunikacji pionowej (Wyj.17 odp.70)., 'Sekretariat: 1 pokój 24 m2 na komórkę (do 3 os.) - wniosek (zgodny z przykładem w pyt. 69, Wyj.16).',
  'Liczba pokoi pracowników = ceil(n/3), GW ceil(n/4) dla każdej komórki z zał.1 osobno - wniosek wynikający z Wyj.16-17.']
