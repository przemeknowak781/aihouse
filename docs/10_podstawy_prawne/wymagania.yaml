# wymagania.yaml — kluczowe wartości liczbowe wymagań dla „Dom LAMELA”
# Źródło: docs/10_podstawy_prawne/00_rejestr_wymagan.md (rejestr skonsolidowany z R1…R8 po weryfikacji niezależnej).
# Stan prawny: 2026-09-25 (Dz.U. 2026 do poz. 1244). WT stosowane na podstawie art. 102a PB (oświadczenie Inwestora).
#
# Format wpisu (klucze ASCII):
#   klucz: {wartosc: <liczba | [lista] | tekst>, jedn: <jednostka>, typ: <min|max|rowne|zakres|info>,
#           id: <W-xxx z rejestru>, status: <zweryfikowane|niezweryfikowane|interpretacja|zalozenie|program>,
#           zrodlo: "<akt/norma + jednostka redakcyjna>"}
#   typ: min — wartość w projekcie >= wartosc; max — <= wartosc; zakres — [dolna, górna] włącznie;
#        rowne — wartość obowiązująca; info — parametr do obliczeń (nie kryterium).
#   status: zalozenie = cel/założenie projektowe (nie przepis); program = MPZP fikcyjny lub program Inwestora.
# Skróty w zrodlo: WT = rozp. MI z 12.04.2002 (t.j. Dz.U. 2022 poz. 1225 ze zm.), stosowane na podstawie art. 102a PB;
#   RPB = rozp. w sprawie szczegółowego zakresu i formy projektu budowlanego (t.j. Dz.U. 2022 poz. 1679 ze zm.).

