# Konfiguracja arkuszy PROJEKTU TECHNICZNEGO — INSTALACJE ELEKTRYCZNE (RPB Dz.U. 2020 poz. 1609 ze zm., § 23–24).
# Generator: lamela.views.instalacje (typy inst_rzut / inst_schemat); CLI:
#   PYTHONPATH=src python3 tools/generuj_widoki.py --arkusze model/arkusze_ie.yaml --out projekt/06_PT_instalacje_elektryczne/rysunki
# Plik NIE zawiera danych budynku ani instalacji — tylko układ arkuszy (treść: model/*.yaml + lamela.obliczenia.elektryka).
wspolne:
  pracownia: "PRACOWNIA PROJEKTOWA — nazwa do uzupełnienia"
  pracownia_adres: "adres pracowni do uzupełnienia"
  inwestor: "(do uzupełnienia)"
  obiekt: "Budynek mieszkalny jednorodzinny wolnostojący „Dom LAMELA”"
  lokalizacja: null
  kategoria: "I"
  stadium: "PT"
  branza: "INSTALACJE ELEKTRYCZNE (IE)"
  prefiks_nr: "PT-IE"
  data: null
  rewizja: "0"
  skala: 50                    # RPB § 9 ust. 3: 1:50 (dopuszczalne 1:100)
  format: auto                 # auto = ekonomiczny (lamela.views.uklad): najmniejszy koszt papieru — ISO 216, wydłużone lub H×L „na miarę”
                               # (H: 297/420/594/841/891; składanie do A4 w ocenie); klasyczny | A2 | [H, L] — patrz uklad.py
  numeracja_pomieszczen: iso
  wysokosc_ciecia: 1.10
  osie_instalacji: zakres       # osie tylko w zasięgu treści rzutu (jak rzuty AR) — bez pustego pasa osi garażu na II p.
  plik_tomu: tom_PT-IE.pdf
  tytul_tomu: "Projekt techniczny — instalacje elektryczne (rysunki)"
  braki_danych: projekt/06_PT_instalacje_elektryczne/BRAKI_DANYCH.md
  instalacje: null
  wyposazenie: null
  uwagi:
    - "Rysunki instalacji na podkładzie rzutów architektury (PB-AR); podkład — linie cienkie szare (warstwy I-PODKLAD*)."
# Formaty: auto (ekonomiczny) z wyjątkiem PT-IE-04 i PT-IE-07 — jawnie H = 420 mm (docs/30_arkusze/zastosowanie_IE.md):
# auto wybiera tam 570×594 / 520×594 przy koszcie równym wariantowi 750×420 / 710×420 (różnica < 0,5 %, rozstrzyga
# tylko kara za niepełny górny rząd 123 mm), a te zużywają o 7 % / 4 % mniej papieru, mają tabele i uwagi w kolumnie
# obok rzutu i tę samą wysokość 420 mm co pozostałe rzuty parteru i dachu (01, 10–13) — jednolita paczka A4.
arkusze:
  - {nr: PT-IE-01, tytul: "INSTALACJA OŚWIETLENIA — RZUT PARTERU", typ: inst_rzut, branza: IE-O, kond: P0, tytul_widoku: "INSTALACJA OŚWIETLENIA — RZUT PARTERU"}
  - {nr: PT-IE-02, tytul: "INSTALACJA OŚWIETLENIA — RZUT I PIĘTRA", typ: inst_rzut, branza: IE-O, kond: P1, tytul_widoku: "INSTALACJA OŚWIETLENIA — RZUT I PIĘTRA"}
  - {nr: PT-IE-03, tytul: "INSTALACJA OŚWIETLENIA — RZUT II PIĘTRA", typ: inst_rzut, branza: IE-O, kond: P2, tytul_widoku: "INSTALACJA OŚWIETLENIA — RZUT II PIĘTRA"}
  - {nr: PT-IE-04, tytul: "GNIAZDA I ZASILANIE URZĄDZEŃ — RZUT PARTERU", typ: inst_rzut, branza: IE-G, kond: P0, tytul_widoku: "GNIAZDA I ZASILANIE URZĄDZEŃ — RZUT PARTERU", format: [420, 750]}
  - {nr: PT-IE-05, tytul: "GNIAZDA I ZASILANIE URZĄDZEŃ — RZUT I PIĘTRA", typ: inst_rzut, branza: IE-G, kond: P1, tytul_widoku: "GNIAZDA I ZASILANIE URZĄDZEŃ — RZUT I PIĘTRA"}
  - {nr: PT-IE-06, tytul: "GNIAZDA I ZASILANIE URZĄDZEŃ — RZUT II PIĘTRA", typ: inst_rzut, branza: IE-G, kond: P2, tytul_widoku: "GNIAZDA I ZASILANIE URZĄDZEŃ — RZUT II PIĘTRA"}
  - {nr: PT-IE-07, tytul: "TELETECHNIKA — RZUT PARTERU", typ: inst_rzut, branza: IE-T, kond: P0, tytul_widoku: "TELETECHNIKA — RZUT PARTERU", format: [420, 710]}
  - {nr: PT-IE-08, tytul: "TELETECHNIKA — RZUT I PIĘTRA", typ: inst_rzut, branza: IE-T, kond: P1, tytul_widoku: "TELETECHNIKA — RZUT I PIĘTRA"}
  - {nr: PT-IE-09, tytul: "TELETECHNIKA — RZUT II PIĘTRA", typ: inst_rzut, branza: IE-T, kond: P2, tytul_widoku: "TELETECHNIKA — RZUT II PIĘTRA"}
  - {nr: PT-IE-10, tytul: "INSTALACJA FOTOWOLTAICZNA — RZUT DACHU", typ: inst_rzut, branza: IE-PV, kond: dach, tytul_widoku: "INSTALACJA FOTOWOLTAICZNA — RZUT DACHU"}
  - {nr: PT-IE-11, tytul: "INSTALACJA FOTOWOLTAICZNA — RZUT PARTERU (FALOWNIK, SPD)", typ: inst_rzut, branza: IE-PV, kond: P0, tytul_widoku: "INSTALACJA FOTOWOLTAICZNA — RZUT PARTERU (FALOWNIK, SPD)"}
  - {nr: PT-IE-12, tytul: "UZIOM I POŁĄCZENIA WYRÓWNAWCZE — RZUT PARTERU", typ: inst_rzut, branza: IE-U, kond: P0, tytul_widoku: "UZIOM I POŁĄCZENIA WYRÓWNAWCZE — RZUT PARTERU"}
  - {nr: PT-IE-13, tytul: "OCHRONA ODGROMOWA I WYRÓWNANIE POTENCJAŁÓW — RZUT DACHU", typ: inst_rzut, branza: IE-U, kond: dach, tytul_widoku: "OCHRONA ODGROMOWA I WYRÓWNANIE POTENCJAŁÓW — RZUT DACHU"}
