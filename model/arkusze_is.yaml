# Konfiguracja arkuszy PROJEKTU TECHNICZNEGO — INSTALACJE SANITARNE (RPB Dz.U. 2020 poz. 1609 ze zm., § 23–24).
# Generator: lamela.views.instalacje (typy inst_rzut / inst_schemat); CLI:
#   PYTHONPATH=src python3 tools/generuj_widoki.py --arkusze model/arkusze_is.yaml --out projekt/05_PT_instalacje_sanitarne/rysunki
# Plik NIE zawiera danych budynku ani instalacji — tylko układ arkuszy. Treść: model/budynek.yaml (dachy § 6, pomieszczenia),
# model/instalacje.yaml, model/wyposazenie.yaml, model/dzialka.yaml + wyniki lamela.obliczenia (uruchamiane przy generowaniu).
wspolne:
  pracownia: "PRACOWNIA PROJEKTOWA — nazwa do uzupełnienia"
  pracownia_adres: "adres pracowni do uzupełnienia"
  inwestor: "(do uzupełnienia)"
  obiekt: "Budynek mieszkalny jednorodzinny wolnostojący „Dom LAMELA”"
  lokalizacja: null            # null → z dzialka.yaml
  kategoria: "I"
  stadium: "PT"
  branza: "INSTALACJE SANITARNE (IS)"
  prefiks_nr: "PT-IS"
  data: null                   # null → meta.data modelu
  rewizja: "0"
  skala: 50                    # RPB § 9 ust. 3: rzuty instalacji 1:50 (dopuszczalne 1:100)
  format: auto                 # auto = ekonomiczny (lamela.views.uklad): najmniejszy koszt papieru — ISO 216, wydłużone lub H×L „na miarę”
                               # (H: 297/420/594/841/891; składanie do A4 w ocenie); klasyczny | A2 | [H, L] — patrz uklad.py
  numeracja_pomieszczen: iso
  wysokosc_ciecia: 1.10
  plik_tomu: tom_PT-IS.pdf
  tytul_tomu: "Projekt techniczny — instalacje sanitarne (rysunki)"
  braki_danych: projekt/05_PT_instalacje_sanitarne/BRAKI_DANYCH.md
  instalacje: null             # null → model/instalacje.yaml (obok budynek.yaml)
  wyposazenie: null
  uwagi:
    - "Rysunki instalacji na podkładzie rzutów architektury (PB-AR); podkład — linie cienkie szare (warstwy I-PODKLAD*)."
# Układ arkuszy (ekonomiczne ustawienie — wymaganie inwestora; raport: docs/30_arkusze/zastosowanie_IS.md):
# * rzuty I i II piętra każdej branży na jednym arkuszu (wiersz: te same osie, wspólna legenda i uwagi — legenda
#   łączna widoków arkusza: lamela.views.instalacje.wspolne.legenda_arkusza),
# * odwodnienie dachów: rzut dachu nad rzutem parteru (rury spustowe) — jedna tabela wyników (raz na arkusz),
# * rozwinięcia kanalizacji i wodociągu na jednym pasku H = 297 mm,
# * rzuty parteru K i WM: max_wysokosc 420 — koszt jak dla 520×594 (różnica 0,2 %), papier −0,011 m² na arkusz,
#   układ jednolity z pozostałymi rzutami parteru (rzut po lewej, kolumna opisowa nad tabliczką); format dobiera `auto`.
arkusze:
  - {nr: PT-IS-01, tytul: "INSTALACJA WODOCIĄGOWA — RZUT PARTERU", typ: inst_rzut, branza: IS-W, kond: P0}
  - nr: PT-IS-02
    tytul: "INSTALACJA WODOCIĄGOWA — RZUTY I PIĘTRA I II PIĘTRA"
    widoki:
      - {typ: inst_rzut, branza: IS-W, kond: P1}
      - {typ: inst_rzut, branza: IS-W, kond: P2}
  - {nr: PT-IS-03, tytul: "KANALIZACJA SANITARNA — RZUT PARTERU", typ: inst_rzut, branza: IS-K, kond: P0, max_wysokosc: 420}
  - nr: PT-IS-04
    tytul: "KANALIZACJA SANITARNA — RZUTY I PIĘTRA I II PIĘTRA"
    widoki:
      - {typ: inst_rzut, branza: IS-K, kond: P1}
      - {typ: inst_rzut, branza: IS-K, kond: P2}
  - nr: PT-IS-05
    tytul: "ODWODNIENIE DACHÓW — RZUT DACHU I RZUT PARTERU"
    widoki:
      - {typ: inst_rzut, branza: IS-D, kond: dach}
      - {typ: inst_rzut, branza: IS-D, kond: P0, tytul_widoku: "ODWODNIENIE DACHÓW — RZUT PARTERU (RURY SPUSTOWE)"}
  - {nr: PT-IS-06, tytul: "OGRZEWANIE — RZUT PARTERU", typ: inst_rzut, branza: IS-CO, kond: P0}
  - nr: PT-IS-07
    tytul: "OGRZEWANIE — RZUTY I PIĘTRA I II PIĘTRA"
    widoki:
      - {typ: inst_rzut, branza: IS-CO, kond: P1}
      - {typ: inst_rzut, branza: IS-CO, kond: P2}
  - {nr: PT-IS-08, tytul: "WENTYLACJA MECHANICZNA — RZUT PARTERU", typ: inst_rzut, branza: IS-WM, kond: P0, max_wysokosc: 420}
  - nr: PT-IS-09
    tytul: "WENTYLACJA MECHANICZNA — RZUTY I PIĘTRA I II PIĘTRA"
    widoki:
      - {typ: inst_rzut, branza: IS-WM, kond: P1}
      - {typ: inst_rzut, branza: IS-WM, kond: P2}
  - nr: PT-IS-10
    tytul: "KANALIZACJA I WODOCIĄG — ROZWINIĘCIA"
    widoki:
      - {typ: inst_schemat, schemat: kanalizacja}
      - {typ: inst_schemat, schemat: woda}
  - {nr: PT-IS-11, tytul: "SCHEMAT POMPY CIEPŁA, C.O. I C.W.U.", typ: inst_schemat, schemat: pc}
