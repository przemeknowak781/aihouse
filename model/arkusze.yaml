# Konfiguracja arkuszy rysunków architektury generowanych z modelu (lamela.views, tools/generuj_widoki.py).
# PROPOZYCJA formatu (opis pól: src/lamela/views/sheets.py). Plik NIE zawiera danych budynku — tylko układ arkuszy;
# wszystkie wartości geometryczne, materiały, rzędne i opisy pochodzą z model/budynek.yaml + model/dzialka.yaml.
wspolne:
  tytul_tomu: "Projekt architektoniczno-budowlany — rysunki"   # nagłówek spisu tomu rysunków (sheets.py: domyślny tytuł dotyczył architektury)
  pracownia: "PRACOWNIA PROJEKTOWA — nazwa do uzupełnienia"
  pracownia_adres: "adres pracowni do uzupełnienia"
  inwestor: "(do uzupełnienia)"
  obiekt: "Budynek mieszkalny jednorodzinny wolnostojący „Dom LAMELA”"
  lokalizacja: null            # null → z dzialka.yaml (nr działki, obręb; adres/gmina, jeśli podane)
  kategoria: "I"
  stadium: "PB"
  branza: "ARCHITEKTURA (AR)"
  prefiks_nr: "PB-AR"
  data: null                   # null → meta.data z budynek.yaml
  rewizja: "0"
  skala: 50                    # PAB wymaga ≥ 1:100 (R2 F18); 1:50 — czytelność warstw
  format: auto                 # auto = ekonomiczny (lamela.views.uklad): najmniejszy koszt papieru — ISO 216, wydłużone lub H×L „na miarę”
                               # (H: 297/420/594/610/841/891/914 lub szerokość = rolka 297…914; składanie do A4 w ocenie); klasyczny | A2 | [H, L] — patrz uklad.py
  numeracja_pomieszczen: iso   # parter = 1.xx (PN-B-01025 / R4 pkt 3.9); „model” — identyfikatory z modelu
  wysokosc_ciecia: 1.10
  glebokosc_widoku: 1.5
  wymiary_wewnetrzne: true
  kolorystyka: true
  uwagi: []
# przekroje (W-315): A-A przez schody, boks C i bryłę A (N–S); B-B przez wspornik bryły A, strefę dzienną i garaż (W–E)
przekroje:
  - {id: A, x: 6.55, patrz: E}
  - {id: B, y: 3.30, patrz: N}
# Układ kompletu PAB (ekonomiczne ustawienie na arkuszach — wymaganie inwestora; analiza: docs/30_arkusze/zastosowanie_AR.md).
# Skala 1:50 bez zmian (RPB § 9: PAB ≥ 1:100). Widoki łączone na wspólnych arkuszach, format dobiera silnik (auto):
# * PB-AR-03 — rzut II piętra nad rzutem dachu (ten sam zasięg bryły; 590×891 = 9 × A4, składanie dobre);
# * PB-AR-04 — przekroje A-A i B-B w jednym wierszu (wspólna linia terenu i rzędne kondygnacji na jednej wysokości);
#   max_wysokosc 594 wyklucza wariant pionowy 580×841 (więcej papieru, mniejsze wypełnienie, przekroje jeden pod drugim);
# * PB-AR-05 — rozwinięcie elewacji S → E → N → W (sąsiednie elewacje stykają się tym samym narożnikiem budynku),
#   wspólna legenda kolorystyki i materiałów, pasek 297 mm wysokości składany do A4 bez zgięć poziomych.
arkusze:
  - {nr: PB-AR-01, tytul: "RZUT PARTERU", typ: rzut, kond: P0}
  - {nr: PB-AR-02, tytul: "RZUT I PIĘTRA", typ: rzut, kond: P1}
  - nr: PB-AR-03
    tytul: "RZUT II PIĘTRA I RZUT DACHU"
    widoki:
      - {typ: rzut, kond: P2}
      - {typ: dach, opcje: {opis_dachu_szer: 90}}   # opisy przegród dachu zawijane do ≤ 90 mm (lamela.views.plan)
  - nr: PB-AR-04
    tytul: "PRZEKROJE A-A I B-B"
    max_wysokosc: 594
    widoki:
      - {typ: przekroj, przekroj: A}
      - {typ: przekroj, przekroj: B}
  - nr: PB-AR-05
    tytul: "ELEWACJE"
    widoki:
      - {typ: elewacja, strona: S, tytul_widoku: "ELEWACJA POŁUDNIOWA (OGRODOWA)"}
      - {typ: elewacja, strona: E}
      - {typ: elewacja, strona: N, tytul_widoku: "ELEWACJA PÓŁNOCNA (OD ULICY)"}
      - {typ: elewacja, strona: W}
