przegrody:
  SZ1:
    nazwa: "Ściana zewnętrzna nośna, silikat 18 + ETICS EPS 20"
    typ: sciana_zewn
    warstwy:
      - {mat: TYNK_GIPS, d: 0.015}
      - {mat: SIL18, d: 0.18, konstrukcyjna: true}
      - {mat: EPS031, d: 0.20}
      - {mat: TYNK_SIL, d: 0.007}
  SW1:
    nazwa: "Ściana wewnętrzna nośna, silikat 18"
    typ: sciana_wewn_nosna
    warstwy:
      - {mat: TYNK_GIPS, d: 0.015}
      - {mat: SIL18, d: 0.18, konstrukcyjna: true}
      - {mat: TYNK_GIPS, d: 0.015}
  SD1:
    nazwa: "Ścianka działowa, silikat 12"
    typ: scianka_dzialowa
    warstwy:
      - {mat: TYNK_GIPS, d: 0.015}
      - {mat: SIL12, d: 0.12, konstrukcyjna: true}
      - {mat: TYNK_GIPS, d: 0.015}
  POD-0:
    nazwa: "Podłoga na gruncie"
    typ: podloga_na_gruncie
    warstwy:
      - {mat: GRES, d: 0.010}
      - {mat: JASTRYCH, d: 0.065}
      - {mat: XPS300, d: 0.150}
      - {mat: ZB_C25, d: 0.120, konstrukcyjna: true}
      - {mat: PIASEK, d: 0.150}
  POD-1:
    nazwa: "Podłoga na stropie (warstwy nad płytą)"
    typ: strop
    warstwy:
      - {mat: DESKA_DEB, d: 0.015}
      - {mat: JASTRYCH, d: 0.055}
      - {mat: EPS_AKU, d: 0.080}
  SD-D1:
    nazwa: "Stropodach pełny, odwrócony spadek PIR"
    typ: stropodach
    warstwy:
      - {mat: EPDM, d: 0.0015}
      - {mat: PIR, d: 0.220}
      - {mat: PAROIZ, d: 0.002}
      - {mat: ZB_C30, d: 0.200, konstrukcyjna: true}
      - {mat: TYNK_GIPS, d: 0.010}
  TAR1:
    nazwa: "Taras na płycie wspornikowej"
    typ: taras
    warstwy:
      - {mat: DESKA_KOMP, d: 0.025}
      - {mat: LEGARY, d: 0.045}
      - {mat: HYDRO, d: 0.004}
      - {mat: ZB_C30, d: 0.200, konstrukcyjna: true}

