# Model TESTOWY pipeline'u (nie jest projektem Domu LAMELA!).
# Prosty dom 2-kondygnacyjny 10 x 8 m (w osiach): okna, drzwi, schody dwubiegowe ze spocznikiem,
# dach płaski z attyką, płyta-wspornik (taras) na słupach nad miejscem postojowym, lamele na elewacji płd.
# Zgodny z docs/SCHEMAT_MODELU.md. Używany przez tools/test_pipeline.py.
meta: {nazwa: "Dom testowy pipeline'u 3D", wersja: "1.0", data: "2026-09-25"}
uklad: {zero_abs: 101.65, azymut_osi_y: 0.0}
osie:
  x: {A: 0.00, B: 4.20, C: 7.00, D: 10.00}
  y: {"1": 0.00, "2": 3.20, "3": 4.50, "4": 8.00}
kondygnacje:
  - {id: P0, nazwa: Parter, rzedna: 0.00, wys_kondygnacji: 3.06, wys_w_swietle: 2.70, podloga: POD-0}
  - {id: P1, nazwa: Piętro, rzedna: 3.06, wys_kondygnacji: 2.91, wys_w_swietle: 2.70, podloga: POD-1}

