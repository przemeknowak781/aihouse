  AT1:
    nazwa: 'Attyka: żelbet 18 cm (wieniec podniesiony), izolacja z 3 stron (EPS 031 10 cm od dachu, ETICS od zewnątrz, PIR 4 cm na koronie), obróbka blacharska ze spadkiem do dachu, wywinięcie membrany ≥ 0,15 m'
