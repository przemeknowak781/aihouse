# Model budynku „Dom LAMELA” — KONCEPCJA OSTATECZNA (jedno źródło prawdy; schemat: docs/SCHEMAT_MODELU.md).
# PLIK GENEROWANY skryptem tools/buduj_model.py — NIE EDYTOWAĆ RĘCZNIE (zmiany wprowadzać w parametrach skryptu).
# Układ: x → wschód, y → północ, z → góra; (0,0) = oś A × oś 1; ±0,00 = posadzka P0. Wymiary w m.

meta: {nazwa: Dom LAMELA, wersja: '1.0', data: '2026-09-25', stadium: koncepcja ostateczna (synteza W2 + przeszczepy W1/W3 + poprawki J1–J3), autor: (do uzupełnienia — projektant z uprawnieniami bez ograniczeń), zrodlo: tools/buduj_model.py (model parametryczny), uwagi: 'WT (t.j. Dz.U. 2022 poz. 1225 ze zm.) w brzmieniu do 19.09.2026, stosowane na podstawie art. 102a PB (oświadczenie Inwestora)'}
uklad: {zero_abs: 101.65, azymut_osi_y: 0.0}
osie:
  x: {A': -1.0, A: 0.0, B: 3.875, C: 5.875, M: 7.19, D: 8.5, D': 9.875, E: 12.0, P: 14.875, F: 18.375}   # A' = oś lekkiej ściany wspornika; M = ścianka środkowa schodów; D' = ścianka WC
  y: {'1': 0.0, '2': 2.875, H: 3.75, '3': 5.125, '4': 8.75, '5': 9.375}   # H = ścianka holu P1

kondygnacje:
  - {id: P0, nazwa: Parter, rzedna: 0.0, wys_kondygnacji: 3.15, wys_w_swietle: 2.77, podloga: POD-0}
  - {id: P1, nazwa: I piętro, rzedna: 3.15, wys_kondygnacji: 3.15, wys_w_swietle: 2.77, podloga: POD-1}
  - {id: P2, nazwa: II piętro, rzedna: 6.3, wys_kondygnacji: 3.0, wys_w_swietle: 2.77, podloga: POD-1}

