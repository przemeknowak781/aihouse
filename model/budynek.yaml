# Przegrody — ściany od wnętrza do zewnątrz; poziome od góry do dołu (brief §9: pełne warstwy)
przegrody:
  SZ1:
    nazwa: 'Ściana zewnętrzna nośna: silikat 18 + ETICS EPS 031 20 cm (U ≈ 0,15)'
    typ: sciana_zewn
    warstwy:
      - {mat: TYNK_GIPS, d: 0.015, funkcja: szczelnosc}
      - {mat: SIL18, d: 0.18, konstrukcyjna: true}
      - {mat: EPS031, d: 0.2}
      - {mat: TYNK_SIL, d: 0.01}
  SZ2:
    nazwa: 'Ściana zewnętrzna bryły A (P2) za lamelami: silikat 18 + wełna fasadowa 20 cm + membrana UV-stabilna (czarna); szczelina wentylowana ok. 11 cm i lamele na ruszcie — element `lamele` (U ≈ 0,16)'
    typ: sciana_zewn
    warstwy:
      - {mat: TYNK_GIPS, d: 0.015, funkcja: szczelnosc}
      - {mat: SIL18, d: 0.18, konstrukcyjna: true}
      - {mat: WELNA_FAS, d: 0.2}
      - {mat: MEMB_WIATR, d: 0.01}
  SZL:
    nazwa: 'Ściana zewnętrzna lekka A'' (na wsporniku P2): GK + OSB (szczelność) + szkielet KVH 45×200 z wełną + DWD + wełna fasadowa 18 cm + membrana UV (lico zewn. 0,30 m od osi — jak SZ2, ciągłość warstw w narożu); bez funkcji nośnej (U ≈ 0,10)'
    typ: sciana_zewn
    warstwy:
      - {mat: GK, d: 0.025}
      - {mat: OSB, d: 0.015, funkcja: szczelnosc}
      - {mat: WELNA_035, d: 0.2, konstrukcyjna: true, frakcje: [{mat: WELNA_035, udzial: 0.88}, {mat: DREWNO_KVH, udzial: 0.12}]}
      - {mat: DWD16, d: 0.016}
      - {mat: WELNA_FAS, d: 0.18}
      - {mat: MEMB_WIATR, d: 0.004}
  SW18:
    nazwa: 'Ściana wewnętrzna nośna: silikat 18, tynk gipsowy obustronnie'
    typ: sciana_wewn_nosna
    warstwy:
      - {mat: TYNK_GIPS, d: 0.015}
      - {mat: SIL18, d: 0.18, konstrukcyjna: true}
      - {mat: TYNK_GIPS, d: 0.015}
  SWZB:
    nazwa: Ściana wewnętrzna nośna żelbetowa 18 cm (trzon klatki na P0 — usztywnienie w kierunku x, J2)
    typ: sciana_wewn_nosna
    warstwy:
      - {mat: TYNK_GIPS, d: 0.015}
      - {mat: ZB_C25, d: 0.18, konstrukcyjna: true}
      - {mat: TYNK_GIPS, d: 0.015}
  SWG:
    nazwa: 'Ściana nośna dom–garaż nieogrzewany: silikat 18 + wełna 12 cm od strony garażu + tynk (U ≈ 0,24 ≤ 0,30; szczelna na spaliny)'
    typ: sciana_wewn_nosna
    warstwy:
      - {mat: TYNK_GIPS, d: 0.015}
      - {mat: SIL18, d: 0.18, konstrukcyjna: true}
      - {mat: WELNA_035, d: 0.12}
      - {mat: TYNK_CW, d: 0.01}
  SCZB15:
    nazwa: 'Ściana środkowa klatki schodowej: żelbet C25/30 15 cm, monolityczna z płytami biegów i spoczników, ciągła P0–P2 (przez poziomy stropów), zakotwiona w podciągach B8/B9/B10 osi 3 (audyt A2 I-2)'
    typ: sciana_wewn_nosna
    warstwy:
      - {mat: ZB_C25, d: 0.15, konstrukcyjna: true}
  DZ12:
    nazwa: 'Ścianka działowa: silikat 12 + tynk gipsowy obustronnie (R''w ≥ 45 dB)'
    typ: scianka_dzialowa
    warstwy:
      - {mat: TYNK_GIPS, d: 0.015}
      - {mat: SIL12, d: 0.12, konstrukcyjna: true}
      - {mat: TYNK_GIPS, d: 0.015}
  DZGK:
    nazwa: Ścianka działowa GK 12,5 cm z kasetą drzwi przesuwnych chowanych (2 × GK impregnowana 12,5 mm obustronnie, kaseta stalowa 7,5 cm z wełną poza strefą kasety; R'w ≥ 40 dB)
    typ: scianka_dzialowa
    warstwy:
      - {mat: GK, d: 0.025}
      - {mat: WELNA_035, d: 0.075, konstrukcyjna: true}
      - {mat: GK, d: 0.025}
  GK10:
